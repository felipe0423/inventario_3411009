<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar sesion inventario ADSO</title>
    <!--CSS de boostrap 5.3.3 desde url predeterminada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--libreria de iconos de bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados-->
</head>
<body class="bg-body-tertiary">
    <!--menun lateral-->
    <!--offcanvas en pantallas menores al lg es un panel oculto que se desliza-->
    <!--desde el lg se muestra normal. offcanvas-start lo hace salir por la izquierda. sidebar es muestra la clace el id 
    usa boton, lo que abre-->

    <aside class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="menulateral" arial-labelledby="tituloMenu">
        <!--Encabezado del panel; bootstrap solo lo muestra en celular-->
        <div class="offcanvas-header border-bottom border-secondary">
            <!--nombre del sistema en el panel movil-->
        <h5 class="offcanvas-title" id="tituloMenu"><i class="bi bi-shop me-2"></i>tienda sena</h5>
        <!--boton x blanco de cierre del panel-->
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#menulateral"
        arial-label="cerrar menu"></button>
        <!--cierra en encabezado movil-->
        </div>
        <!--cuerpo de menu flexbox en columna para apilar logo enlaces y boton de salida-->
        <div class="offcanvas-body d-flex-colum p-3">
            <!--logo solo se ve en computador-->
            <a href="dashboard.html" class="d-none d-lg-flex align-items-center mb-3 text-white text-decoration-none fs-5 
            fw-bold">
            <!--icono verde y nombre-->
            <i class="bi bi-shop me-2 text-sena"></i>tienda sena
            <!--cierra logo-->
        </a>
        </div>
    </aside>
</body>
