<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar sesion inventario ADSO</title>
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados-->
</head>
<body class="login-fondo">

    <!--contenido principal de la pagina (main)-->
    <main class="login-card">

        <!--encabezado del login (header)-->
        <header class="login-encabezado">
            <!--icono de la tienda-->
            <i class="bi bi-shop display-4 text-sena"></i>
            <h1 class="h3 fw-bold">inventario sena</h1> <!--titulo (h)-->
            <p class="text-secondary mb-0">ingresa tus credenciales para continuar</p>

        </header>

        <form action="dashboard.html" method="get"> <!--(form) permite creal el contenido de un formulario cuando se envia
         nos lleva a la ruta (dashboard) el method nos envia la informacion con get-->

         <div class="form-floating mb-3"><!--agrupar un contenido de un contenedor-->
           
            <input type="email" class="form-control" id="correo" placeholder="sena@correo.com" required><!--type obliga que tenga el "@", 
            placeholder es un texto de ejemplo required es que es un campo obligatorio-->
             <label for="correo"><i class="bi envelope me-1"></i>correo electronico</label><!--label es una etiqueta de texto que con el for 
             conecta con el input-->

         </div>
         <divclass=form-floating mb-3>
            <input type="password" class="form-control" id="clave" placeholder="minimo 6 caracteres" minlength="6" required><!--type=password oculta lo que
            escribes, minlength=6 exige almenos 6 caracteres-->
             <label for="clave"><i class="bi bi-lock me-1"></i>contraseña</label>
          
         </div>

         <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="recordar"><!--type checkbox es casilla de verificacion-->
            <label class="form-check-label" for="recordar">recordarme</label>

         </div>
            <a href="#" class="small text-decoration-none">olvido su contraseña?</a>
         </div>

         <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>ingresar</button><!--envia el formulario antes revisa los campos required email y minglet-->

        </form><!--cierra el formulario-->

        <p class="login-pie">¿no tienes cuenta?<a href="registro.html" class="text-decoration-none">registrate zorrita</a></p>
        <footer class="login-pie"> 2026 SENA - ADSO Mixto</footer><!--pie de pagina-->


    </main>
    
</body>
</html>
